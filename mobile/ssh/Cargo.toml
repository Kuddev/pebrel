[package]
name = "pebrel-mobile-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
name = "pebrel_ssh"
crate-type = ["cdylib", "rlib"]

[dependencies]
russh = { version = "=0.62.2", default-features = false, features = ["ring", "rsa"] }
jni = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
