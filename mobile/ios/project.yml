name: Pebrel
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  PebrelCore:
    path: PebrelCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: ${PEBREL_VERSION}
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../ssh/include
      - $(SRCROOT)/../terminal-bridge/include
      - $(SRCROOT)/../../tmp/ios-vt/device/include
targets:
  Pebrel:
    type: application
    platform: iOS
    sources:
      - App
      - ../terminal-bridge/src
      - Resources
      - path: .generated/themes.json
      - path: .generated/Assets.xcassets
      - path: .generated/JetBrainsMono-Regular.ttf
      - path: .generated/MapleMono-NF-CN-Regular.ttf
      - path: .generated/Licenses
        type: folder
    dependencies:
      - package: PebrelCore
      - framework: ../../tmp/ios-vt/GhosttyVT.xcframework
        embed: false
      - framework: ../../tmp/PebrelSSH.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    info:
      path: .generated/Info.plist
      properties:
        CFBundleDisplayName: Pebrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan a computer pairing code.
        NSLocalNetworkUsageDescription: Find and connect to computers on your local network.
        NSBonjourServices: ['_pebrel-pair._tcp']
        UIAppFonts: ['JetBrainsMono-Regular.ttf', 'MapleMono-NF-CN-Regular.ttf']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuddev.pebrel.ios
        SWIFT_OBJC_BRIDGING_HEADER: App/Native.h
        OTHER_LDFLAGS: $(inherited) -u _pebrel_ssh_create -u _pebrel_ssh_close
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PebrelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Pebrel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuddev.pebrel.ios.tests
        SWIFT_OBJC_BRIDGING_HEADER: App/Native.h
  PebrelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pebrel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuddev.pebrel.ios.uitests
schemes:
  Pebrel:
    build:
      targets:
        Pebrel: all
    test:
      targets:
        - PebrelTests
        - PebrelUITests
