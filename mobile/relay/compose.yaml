services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    user: "${PEBREL_RELAY_UID:-0}:${PEBREL_RELAY_GID:-0}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./private/relay.config.json:/config/relay.config.json:ro
    networks: [relay]
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PEBREL_RELAY_DOMAIN: ${PEBREL_RELAY_DOMAIN:?Set your relay domain}
    ports: ["${PEBREL_RELAY_HTTP_PORT:-80}:80", "${PEBREL_RELAY_HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
volumes:
  caddy_data:
  caddy_config:
networks:
  relay:
