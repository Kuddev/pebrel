[package]
name = "pebrel-mobile-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[features]
default = []
relay = ["dep:axum", "dep:hyper-util", "dep:tokio", "dep:tokio-rustls", "dep:tokio-util", "dep:futures-util", "dep:rustls-pemfile", "dep:rcgen", "dep:libc"]
endpoint = ["relay", "dep:tokio-tungstenite", "dep:x509-parser"]
preview = ["endpoint", "dep:if-addrs"]

[[bin]]
name = "pebrel-relay"
path = "src/bin/relay.rs"
required-features = ["relay"]

[dependencies]
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
subtle = "2.6"
thiserror = "2"
qrcode = { version = "0.14", default-features = false }
zeroize = { version = "1", features = ["derive"] }
axum = { version = "0.8", features = ["ws"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
if-addrs = { version = "0.14", optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
x509-parser = { version = "0.18.1", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.29"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
