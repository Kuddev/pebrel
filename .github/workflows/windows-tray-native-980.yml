name: Verify Windows tray behavior through a real Explorer restart
on:
  push:
    branches: [qa/tray-native-980-1119]
permissions:
  contents: read

jobs:
  tray:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extract the released comparison package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP pebrel-259.zip
          curl.exe --fail --location --retry 3 --output $zip https://github.com/Kuddev/pebrel/releases/download/v2.5.9/Pebrel-v2.5.9-windows-arm64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $zip).Hash -ne 'D83C8E904CADB72F6C9FDD86F4008722C890422232DCB179776ABBDB047562D8') { throw 'Digest mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP released
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $exe = @(Get-ChildItem $dest -Recurse -File -Filter pebrel.exe)
          if ($exe.Count -ne 1) { throw 'Expected one released executable' }
          "TRAY_BASELINE=$($exe[0].FullName)" >> $env:GITHUB_ENV
      - name: Reproduce the published tray icon loss
        shell: pwsh
        run: python scripts/conformance/tray_restart_probe.py $env:TRAY_BASELINE baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native-arm64
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the trace-enabled candidate
        shell: pwsh
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture arm64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula --features gpui-shell --bin pebrel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the candidate icon and context menu after Explorer restarts
        shell: pwsh
        run: python scripts/conformance/tray_restart_probe.py target/ci/pebrel.exe candidate
