name: Windows session subscription comparison (WIP)

on:
  workflow_call:
    inputs:
      runtime_run:
        description: Release run for the 2.5.3 package under test
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify both published x64 archives
        shell: pwsh
        env:
          PEBREL_RELEASE_RUN: ${{ inputs.runtime_run }}
        run: |
          if ($env:PEBREL_RELEASE_RUN -ne '43108083569') { throw 'Expected the v2.5.3 release run.' }
          $hashes = @{
            '2.4.0' = 'c3d88a428db402aff27af3a45e2550c8e3b8a5a77a079e580687ed56445c3dc7'
            '2.5.3' = 'c6d7faf53defa32fc43e596d5b8a34963ef6241e95d858762bea450d5f127141'
          }
          foreach ($version in $hashes.Keys) {
            $file = "Pebrel-v$version-windows-x64.zip"
            $path = Join-Path $env:RUNNER_TEMP $file
            Invoke-WebRequest -Uri "https://github.com/Kuddev/pebrel/releases/download/v$version/$file" -OutFile $path
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes[$version]) {
              throw "$file does not match SHA256SUMS"
            }
          }
      - name: Compare the first session snapshot on both binaries
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'Pebrel-v2.4.0-windows-x64.zip'
          $new = Join-Path $env:RUNNER_TEMP 'Pebrel-v2.5.3-windows-x64.zip'
          $output = Join-Path $env:RUNNER_TEMP 'mobile-runtime-evidence/report.json'
          python scripts/conformance/windows_standard_user.py -m scripts.conformance.windows_runtime_subscription_probe --old $old --new $new --output $output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-runtime-evidence
          path: ${{ runner.temp }}/mobile-runtime-evidence
          if-no-files-found: error
          retention-days: 7
