name: Windows startup snapshot regression (WIP)

on:
  workflow_call:
    inputs:
      runtime_run:
        description: Released Windows 2.5.3 baseline run
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: always
      PEBREL_CANDIDATE: 2887ac8ebb5cda0f944cc992e0debe24e0026076
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PEBREL_CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: release
          target: target/release
          legacy-key: windows
          save-if: "false"
      - name: Build the exact GPUI candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:PEBREL_CANDIDATE) {
            throw 'Candidate checkout does not match the reviewed commit.'
          }
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          ./scripts/build-windows-product.ps1 -Configuration release -TargetDirectory target
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostics
          sparse-checkout: scripts/conformance
          persist-credentials: false
      - name: Verify the published x64 baseline
        shell: pwsh
        env:
          PEBREL_RELEASE_RUN: ${{ inputs.runtime_run }}
        run: |
          if ($env:PEBREL_RELEASE_RUN -ne '43108083569') { throw 'Expected the v2.5.3 release run.' }
          $file = 'Pebrel-v2.5.3-windows-x64.zip'
          $path = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://github.com/Kuddev/pebrel/releases/download/v2.5.3/$file" -OutFile $path
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c6d7faf53defa32fc43e596d5b8a34963ef6241e95d858762bea450d5f127141') {
            throw "$file does not match SHA256SUMS"
          }
      - name: Require a first session on the candidate without querying it
        working-directory: diagnostics
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'Pebrel-v2.5.3-windows-x64.zip'
          $new = Join-Path $env:GITHUB_WORKSPACE 'target/release/pebrel.exe'
          $output = Join-Path $env:RUNNER_TEMP 'mobile-runtime-evidence/report.json'
          python scripts/conformance/windows_standard_user.py -m scripts.conformance.windows_runtime_subscription_probe --old $old --old-version 2.5.3 --new $new --new-version 2.5.0 --new-commit $env:PEBREL_CANDIDATE --require-new-cold --output $output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-runtime-evidence
          path: ${{ runner.temp }}/mobile-runtime-evidence
          if-no-files-found: error
          retention-days: 7
