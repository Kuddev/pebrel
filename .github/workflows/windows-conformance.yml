name: Windows PowerShell erase diagnostics (WIP)

on:
  workflow_call:
    inputs:
      runtime_run:
        description: Release run associated with the Windows package under test
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.runtime_run == '43108083569'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download and verify the published v2.5.3 x64 archive
        env:
          PEBREL_RELEASE_RUN: ${{ inputs.runtime_run }}
        shell: pwsh
        run: |
          if ($env:PEBREL_RELEASE_RUN -ne '43108083569') {
            throw 'This diagnostic is pinned to the v2.5.3 release.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'Pebrel-v2.5.3-windows-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/Kuddev/pebrel/releases/download/v2.5.3/Pebrel-v2.5.3-windows-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c6d7faf53defa32fc43e596d5b8a34963ef6241e95d858762bea450d5f127141') {
            throw 'The published x64 archive did not match SHA256SUMS.'
          }
      - name: Capture terminal cells and ConPTY bytes during input erasure
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Pebrel-v2.5.3-windows-x64.zip'
          $output = Join-Path $env:RUNNER_TEMP 'powershell-erase-evidence'
          python scripts/conformance/windows_standard_user.py -m scripts.conformance.windows_powershell_erase_probe --app $archive --output $output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powershell-erase-evidence
          path: ${{ runner.temp }}/powershell-erase-evidence
          if-no-files-found: error
          retention-days: 7

  validate-backend:
    if: inputs.runtime_run == 'c817c08ea33e4be6493fa3eba18eb0898d7ce3c0'
    name: Console host validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c817c08ea33e4be6493fa3eba18eb0898d7ce3c0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: -release-check-v2
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Prepare pinned Windows console runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = if ('${{ runner.arch }}' -eq 'ARM64') { 'arm64' } else { 'x64' }
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture $architecture
      - name: Test the terminal engine and native PTY
        run: cargo test --locked --profile ci -p nebula_terminal
      - name: Check the GPUI product and application tests
        if: matrix.os == 'windows-2022'
        run: cargo check --locked --profile ci -p nebula --bin pebrel --features gpui-test-support --tests
