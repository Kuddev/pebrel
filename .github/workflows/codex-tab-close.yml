name: Check Codex thread switching on Windows
on:
  push:
    branches: [qa/codex-new-thread-windows-1120]
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            codex: x86_64
            app_hash: 55191de815fad98fa72c7db222f20416292d8e499f33e6e2b4def020a5997417
            cli_hash: 94b51ca84648a6923784ef71f06e2feb1e10796ddb3f5d033ccb0fbe8daa2f16
          - os: windows-11-arm
            arch: arm64
            codex: aarch64
            app_hash: 54be1d08514f2d3fecee8705f1bd12625a2b2c1df20437fb98356bbbcdddfdbf
            cli_hash: c437e561e756477c5cbef0e8f99d17761cc59ef87ca5567f2a00a8964ec131cf
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow==11.3.0
      - name: Run the public 2.6.1 binary with the native Codex CLI
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP codex-close
          New-Item -ItemType Directory -Path $root | Out-Null
          $app = "https://github.com/Kuddev/pebrel/releases/download/v2.6.1/Pebrel-v2.6.1-windows-${{ matrix.arch }}.zip"
          $cli = "https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-${{ matrix.codex }}-pc-windows-msvc.exe.zip"
          foreach ($item in @(@($app,"app","${{ matrix.app_hash }}"), @($cli,"cli","${{ matrix.cli_hash }}"))) {
            $zip = Join-Path $root ($item[1] + ".zip")
            curl.exe --fail --location --retry 3 --silent --show-error --output $zip $item[0]
            if ($LASTEXITCODE -or (Get-FileHash $zip).Hash -ne $item[2]) { throw "Archive verification failed" }
            Expand-Archive $zip (Join-Path $root $item[1])
          }
          $native = Get-ChildItem "$root/cli" -Filter 'codex-*-pc-windows-msvc.exe' -Recurse | Select-Object -First 1
          Copy-Item $native.FullName "$root/cli/codex.exe"
          $env:PEBREL_QA_CODEX_BIN = "$root/cli/codex.exe"
          & $env:PEBREL_QA_CODEX_BIN --version
          if ($LASTEXITCODE) { throw "Codex executable did not run" }
          $env:Path = "$root/cli;" + $env:Path
          $exe = (Get-ChildItem "$root/app" -Filter pebrel.exe -Recurse | Select-Object -First 1).FullName
          python scripts/conformance/windows_standard_user.py scripts/conformance/codex_closed_tab_probe.py $exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: codex-close-desktop-${{ matrix.arch }}
          path: ${{ runner.temp }}/codex-close-desktop.png
          retention-days: 1
