name: Windows Explorer notification area recovery
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download the released Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.6.1 -R Kuddev/pebrel -p '*windows-x64.zip' -D "$env:RUNNER_TEMP/published"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Observe the published icon before and after the Explorer restart
        run: python scripts/conformance/tray_restart_probe.py "$env:RUNNER_TEMP/published/*windows-x64.zip" baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the single-fix candidate on 2.6.1
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula --bin pebrel --features gpui-shell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Observe the restored shell icon and its menu after the Explorer restart
        run: python scripts/conformance/tray_restart_probe.py target/ci/pebrel.exe candidate
