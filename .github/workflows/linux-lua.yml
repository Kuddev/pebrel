name: Windows Explorer notification area recovery
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build 2.6.1 with the Explorer registration readout
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          python scripts/conformance/build_tray_probe.py baseline
      - name: Verify Explorer forgets the baseline icon
        run: python scripts/conformance/tray_restart_probe.py target/ci/pebrel.exe baseline
      - name: Build the candidate with the identical registration readout
        run: python scripts/conformance/build_tray_probe.py candidate
      - name: Verify Explorer acknowledges the restored candidate icon and the tray menu opens
        run: python scripts/conformance/tray_restart_probe.py target/ci/pebrel.exe candidate
