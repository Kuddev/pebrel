name: Late command history and manual terminal scrolling
on: workflow_dispatch
permissions:
  contents: read
jobs:
  viewport:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          revision: dependencies-v1
          target: target/ci
          save-if: "false"
      - name: Compare scrolling before and after the asynchronous archive arrives
        run: |
          cargo test --locked --config .github/ci-profile.toml --profile ci -p pebrel --features gpui-test-support --bin pebrel -- recent_output_tests::
