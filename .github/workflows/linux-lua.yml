name: Windows CodeBuddy cold recovery on the stable source
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install CodeBuddy CLI and publish both command shims to the test shells
        run: |
          $bin = Join-Path $env:LOCALAPPDATA pebrel-qa-codebuddy
          npm install --global --prefix $bin @tencent-ai/codebuddy-code@2.150.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $node = Split-Path (Get-Command node.exe).Source
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', ($bin + ';' + $node + ';' + $userPath), 'User')
          $bin >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the single-fix candidate on 2.6.1
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula -p nebula_hook --bin pebrel --bin pebrel-hook --features nebula/gpui-shell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore two same-directory conversations in their original panes
        run: python scripts/conformance/windows_standard_user.py scripts/conformance/agent_recovery/run.py --app target/ci/pebrel.exe --agent codebuddy --rounds 2
