name: Windows OMP title across prompt timings
on: workflow_dispatch
permissions:
  contents: read

jobs:
  recovery:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the candidate and its hook helper
        if: ${{ !cancelled() }}
        id: build
        shell: pwsh
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p pebrel -p pebrel_hook --features pebrel/gpui-test-support --bin pebrel --bin pebrel-hook
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install the verified upstream OMP executable
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: install
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA omp
          New-Item -ItemType Directory -Path $bin | Out-Null
          $exe = Join-Path $bin omp.exe
          curl.exe --fail --location --retry 3 --output $exe https://github.com/can1357/oh-my-pi/releases/download/v18.22.2/omp-windows-x64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne 'BAB49ACF7E0BCA6FC98213B1F9F21BC7BFDB5070AFA52EB494EC400337395848') {
            throw 'OMP release digest does not match v18.22.2'
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', (([string]$userPath).TrimEnd(';') + ';' + $bin), 'User')
          $bin >> $env:GITHUB_PATH
      - name: Exercise OMP immediately after output and after the visible PowerShell prompt
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $failures = 0
          foreach ($mode in @('omp', 'omp-ready', 'omp', 'omp-ready', 'omp', 'omp-ready')) {
            Write-Host "Cold start mode $mode"
            python scripts/conformance/windows_standard_user.py scripts/conformance/windows_issue_checks.py $mode target/ci/pebrel.exe
            if ($LASTEXITCODE) { $failures++ }
          }
          if ($failures) { throw "$failures OMP cold starts failed" }
