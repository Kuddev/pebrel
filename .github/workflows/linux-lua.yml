name: Stable terminal formula reflow and pointer tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  terminal-math:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          revision: dependencies-v1
          target: target/ci
          save-if: "false"
      - name: Run the scanner, overlay and pointer cases on the patch release source
        run: |
          cargo test --locked --config .github/ci-profile.toml --profile ci -p nebula --features gpui-test-support --bin pebrel -- terminal_math:: math_overlay:: gpui_shell::terminal::view::pointer::tests::
