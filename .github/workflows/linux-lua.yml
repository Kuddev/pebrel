name: Windows settings wallpaper and layout regressions
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Prepare the Windows runtime
        run: ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
      - name: Exercise wallpaper loading, theme colors and Settings layout
        run: >-
          cargo test --locked --config .github/ci-profile.toml --profile ci -p nebula
          --features gpui-test-support --bin pebrel --
          gpui_shell::wallpaper::
          settings_surfaces_follow_the_reference_across_builtin_themes
          gpui_shell::workspace::settings_navigation::
          settings_cards_use_desktop_width_and_keep_outer_spacing
          --test-threads=1
