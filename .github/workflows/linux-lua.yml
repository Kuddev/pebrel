name: Windows imported default shell in splits
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare the published Pebrel and Niubash packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.6.1 -R Kuddev/pebrel -p '*windows-x64.zip' -D "$env:RUNNER_TEMP/published"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP niubash.zip
          gh release download v1.5.0 -R unixwin/niubash -p 'niubash-v1.5.0-win-x64.zip' -O $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BB2E142EC617E91CB48BDE8C0FA2B9CCE2DC95BFC00857C82CEF6A7AD4E12BCC') {
            throw 'unexpected Niubash digest'
          }
          $folder = Join-Path $env:RUNNER_TEMP niubash
          Expand-Archive $archive $folder
          $exe = (Get-Item "$folder/niubash-v1.5.0-win-x64/niu.exe").FullName
          "SPLIT_QA_NIU=$exe" >> $env:GITHUB_ENV
      - name: Reproduce the PowerShell fallback on Pebrel 2.6.1
        run: python scripts/conformance/windows_standard_user.py scripts/conformance/windows_split_profile.py published "$env:RUNNER_TEMP/published/*windows-x64.zip" "$env:SPLIT_QA_NIU"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the single-fix candidate on 2.6.1
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula --bin pebrel --features gpui-shell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Niubash in both splits from the default and cmd tabs
        run: python scripts/conformance/windows_standard_user.py scripts/conformance/windows_split_profile.py candidate target/ci/pebrel.exe "$env:SPLIT_QA_NIU"
