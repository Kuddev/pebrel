name: Build the CodeBuddy cold recovery candidate for InstaBox
on: workflow_dispatch
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Install native dependencies
        run: |
          # 避开 runner 默认 Azure 镜像的低速下载，保留现有发行版与签名配置。
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zsh libasound2-dev libdbus-1-dev libudev-dev \
            xvfb xauth x11-utils weston libvulkan1 mesa-vulkan-drivers \
            libfontconfig1-dev libfreetype6-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxi-dev

      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: -release-check-v2
          revision: dependencies-v1
          target: |
            target/ci
            target/release
          save-if: "false"
      - name: Build the desktop executable
        run: |
          cargo build --config .github/ci-profile.toml --locked --profile ci -p pebrel -p pebrel_hook --bin pebrel --bin pebrel-hook --features pebrel/gpui-shell
          install -s -m 755 target/ci/pebrel "$RUNNER_TEMP/pebrel"
          install -s -m 755 target/ci/pebrel-hook "$RUNNER_TEMP/pebrel-hook"
          sha256sum "$RUNNER_TEMP/pebrel" "$RUNNER_TEMP/pebrel-hook"
      - uses: actions/upload-artifact@v4
        with:
          name: codebuddy-port-linux
          path: |
            ${{ runner.temp }}/pebrel
            ${{ runner.temp }}/pebrel-hook
          retention-days: 7
