name: Verify macOS fullscreen toolbar transitions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fullscreen:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          revision: dependencies-v1
          target: target/ci
          save-if: "false"
      - name: Check stable title-bar geometry through consecutive fullscreen transitions
        run: cargo test --locked --config .github/ci-profile.toml --profile ci -p nebula --features gpui-test-support --bin pebrel terminal_find_precedes_command_manager_in_both_tab_layouts
      - run: python3 scripts/conformance/macos_fullscreen_qa/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-fullscreen-evidence
          path: |
            ${{ runner.temp }}/fullscreen-evidence/*/step-*
            ${{ runner.temp }}/fullscreen-evidence/*/runner.log
          retention-days: 7
