name: Nix package and profile verification
on:
  push:
    branches: [verify/nonui-nix-424-20261117]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE: 75c5d2462723a56100ae9990136ebdd0ad62a6c4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/424/head
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          enable_kvm: false
      - name: Check the derivation and its dependency hash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(uname -m)" = x86_64
          nix eval --raw .#pebrel.version
          nix build --no-link -L .#pebrel.cargoDeps 2>&1 | tee "$RUNNER_TEMP/nix-vendor.log"
      - name: Build package and install in fresh profile
        run: |
          set -euo pipefail
          df -h / /nix/store
          nix build -L .#pebrel
          nix profile add --profile "$RUNNER_TEMP/test-profile" .#pebrel
          prefix="$RUNNER_TEMP/test-profile"
          for name in pebrel pebrel-hook; do
            test -x "$prefix/bin/$name"
            test "$(realpath "$prefix/bin/$name")" = "$(realpath "result/bin/$name")"
          done
          test -s "$prefix/share/applications/io.github.kuddev.pebrel.desktop"
          test -s "$prefix/share/metainfo/io.github.kuddev.pebrel.metainfo.xml"
          test -s "$prefix/share/icons/hicolor/1024x1024/apps/io.github.kuddev.pebrel.png"
          test -s "$prefix/share/zsh/vendor-completions/_pebrel"
          test -s "$prefix/share/bash-completion/completions/pebrel"
          test -s "$prefix/share/fish/vendor_completions.d/pebrel.fish"
          "$prefix/bin/pebrel" --version | grep -F "$(nix eval --raw .#pebrel.version)"
      - name: Exercise the installed app under X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils zsh
          # Use the same Mesa and Vulkan ABI as the installed Nix binary on this GPU-less runner.
          hook=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa.llvmpipeHook)
          tools=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#vulkan-tools)
          source "$hook/nix-support/setup-hook"
          test -r "$VK_DRIVER_FILES"
          xvfb-run -a "$tools/bin/vulkaninfo" --summary
          GITHUB_SHA="$CANDIDATE" xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/conformance/run.py --app "$RUNNER_TEMP/test-profile/bin/pebrel" \
              --platform linux-x86_64-nix --output "$RUNNER_TEMP/nix-conformance.json" \
              --artifacts "$RUNNER_TEMP/nix-conformance-artifacts"
      - name: Retain the startup error from the isolated X11 test
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          report = root / 'nix-conformance.json'
          if report.is_file() and json.loads(report.read_text())['cases']['boot']['status'] == 'failed':
              log = root / 'nix-conformance-artifacts' / 'pebrel-1.log'
              lines = log.read_text(errors='replace').splitlines()
              diagnosis = re.compile(r'panicked at|caused by|error|not found|could not|failed', re.I)
              selected = {j for i, line in enumerate(lines) if diagnosis.search(line)
                          for j in range(i, min(i + 2, len(lines)))}
              (root / 'nix-boot-error.txt').write_text(''.join(lines[i][:1200] + '\n' for i in sorted(selected)[:35]))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-package-evidence
          path: |
            ${{ runner.temp }}/nix-vendor.log
            ${{ runner.temp }}/nix-conformance.json
            ${{ runner.temp }}/nix-boot-error.txt
          if-no-files-found: warn
