name: Cross-platform Preview packages
run-name: "Alternate-screen table alignment (PR 907)"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Must be false for this review run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terminal-math:
    if: ${{ inputs.publish == false }}
    name: Native terminal math checks
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONUTF8: "1"
      RUST_BACKTRACE: "1"
      REVIEW_SOURCE: a526345485064e7ed182dd084eb62640f2466042
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check reviewed source
        run: |
          git merge-base --is-ancestor "$REVIEW_SOURCE" HEAD
          git diff --exit-code "$REVIEW_SOURCE" -- nebula_app/src/display
      - name: Install native dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zsh libasound2-dev libdbus-1-dev libudev-dev \
            xvfb xauth x11-utils weston libvulkan1 mesa-vulkan-drivers \
            libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xinput-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: -release-check-v2
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Run the author's cases and independent fixed-column case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          printf '%s\n' "$REVIEW_SOURCE" > review-evidence/source.txt
          cargo nextest run --config .github/ci-profile.toml --cargo-profile ci \
            --locked --workspace --features nebula/gpui-test-support --no-fail-fast --retries 0 \
            -E 'test(alt_screen_renders_agent_math) | test(wrapped_inline_formula_stays_on_closing_row_and_compacts_trailing_text) | test(review_alt_screen_table_columns)' \
            2>&1 | tee review-evidence/results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alt-screen-math-pr907-evidence
          path: review-evidence
          if-no-files-found: warn
          retention-days: 14
