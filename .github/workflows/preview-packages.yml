name: Cross-platform Preview packages
run-name: "Windows native Escape test (issue 655)"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Must be false for this input test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-escape:
    if: ${{ inputs.publish == false }}
    name: Published runtime and native keyboard
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify and unpack the test inputs
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'pebrel-escape-inputs'
          New-Item -ItemType Directory -Path $testDir | Out-Null
          $zip = Join-Path $testDir 'Pebrel-v2.5.3-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/Kuddev/pebrel/releases/download/v2.5.3/Pebrel-v2.5.3-windows-x64.zip' -OutFile $zip
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'c6d7faf53defa32fc43e596d5b8a34963ef6241e95d858762bea450d5f127141') {
            throw 'Public ZIP digest differs from the release record'
          }
          $metadata = npm pack '@anthropic-ai/claude-code-win32-x64@2.1.292' --ignore-scripts --json --pack-destination $testDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the reported CLI version' }
          $package = ($metadata | ConvertFrom-Json)[0]
          if ($package.version -ne '2.1.292' -or $package.integrity -ne 'sha512-CXrrjj7Czs9o2YossKkN3z/K+/1GmIjjt3H8muHBDzxw/WM/J9I4kz6jBI4wLwt5miVMkXwwhrwT0hhyNPYAIw==') {
            throw 'Unexpected CLI package integrity'
          }
          tar.exe -xzf (Join-Path $testDir $package.filename) -C $testDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the CLI package' }
          $binaries = @(Get-ChildItem -LiteralPath (Join-Path $testDir 'package') -Recurse -File -Filter 'claude.exe')
          if ($binaries.Count -ne 1) { throw 'Expected one CLI executable' }
          "PEBREL_655_ARCHIVE=$zip" >> $env:GITHUB_ENV
          "PEBREL_655_CLI=$($binaries[0].FullName)" >> $env:GITHUB_ENV

      - name: Run Left, Right, MCP, Escape on the Windows input path
        shell: pwsh
        run: |
          python scripts/conformance/windows_standard_user.py scripts/conformance/windows_escape_review.py --archive $env:PEBREL_655_ARCHIVE --cli $env:PEBREL_655_CLI --evidence review-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload terminal state and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-escape-655-evidence
          path: review-evidence
          if-no-files-found: warn
          retention-days: 7
