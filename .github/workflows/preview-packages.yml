name: Cross-platform Preview packages

run-name: >-
  macOS 12 review PR 815 (${{ inputs.preview_id || format('run-{0}', github.run_number) }})

on:
  workflow_dispatch:
    inputs:
      preview_id:
        description: Optional short Preview id; defaults to the Actions run and attempt numbers
        required: false
        type: string
      publish:
        description: Must be false for the macOS 12 review build
        required: true
        default: false
        type: boolean

concurrency:
  group: preview-${{ github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  REVIEW_SOURCE: "55f1535f7d53e0fd5bf3533a7aff218ddfa57704"
  PYTHONUTF8: "1"

jobs:
  prepare:
    name: Validate Preview inputs
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      preview_id: ${{ steps.metadata.outputs.preview_id }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SOURCE }}
          persist-credentials: false
      - name: Verify review source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_SOURCE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve package metadata
        id: metadata
        env:
          REQUESTED_PREVIEW_ID: ${{ inputs.preview_id }}
          PUBLIC_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: |
          test "$PUBLIC_PREVIEW" = false
          version="$(python3 scripts/preview_release.py \
            --print-package-version nebula_app/Cargo.toml)"

          preview_id="$REQUESTED_PREVIEW_ID"
          if [[ -z "$preview_id" ]]; then
            preview_id="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          VERSION="$version" PREVIEW_ID="$preview_id" python3 - <<'PY'
          import os
          from scripts.preview_release import validate_labels

          validate_labels(os.environ["VERSION"], os.environ["PREVIEW_ID"])
          PY

          {
            echo "version=$version"
            echo "preview_id=$preview_id"
            echo "asset_version=$version-preview.$preview_id"
          } >>"$GITHUB_OUTPUT"

      - name: Check platform cfg budget
        run: python3 scripts/check_platform_cfg.py

      - name: Test packaging and conformance harnesses
        run: >-
          python3 -m unittest
          scripts.tests.test_preview_release
          scripts.tests.test_macos_dmg
          scripts.tests.test_ai_session_probe
          scripts.tests.test_platform_cfg
          scripts.tests.test_windows_resources
          scripts.tests.test_pebrel_branding
          scripts.tests.test_app_icons
          scripts.tests.test_git_attributes
          scripts.tests.test_xplat
          scripts.conformance.tests.test_harness
          scripts.conformance.tests.test_resize
          scripts.conformance.tests.test_scrollback
          scripts.conformance.tests.test_lifecycle
          scripts.conformance.tests.test_posix_lifecycle

      - name: Compile Python helpers
        run: python3 -m compileall -q scripts/preview_release.py scripts/conformance

      - name: Parse macOS packaging script
        run: bash -n scripts/package-macos.sh

  macos:
    name: macOS ${{ matrix.architecture }} Preview
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: aarch64
            native_architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
            native_architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIEW_ID: ${{ needs.prepare.outputs.preview_id }}
      ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SOURCE }}
          persist-credentials: false
      - name: Verify review source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_SOURCE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.native_architecture }}"

      - name: Require the modern AppKit SDK for native window controls
        run: |
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26

      - name: Test native DMG capacity and mounted contents
        run: python3 -m unittest scripts.tests.test_macos_dmg -v

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Test native shell startup and harness process ownership
        run: >-
          python3 -m unittest scripts.tests.test_shell_integration
          scripts.conformance.tests.test_posix_lifecycle -v

      - name: Build GPUI release binary
        run: cargo build --locked --release -p nebula --bin pebrel -p nebula_hook --bin pebrel-hook --features nebula/gpui-shell

      - name: Package ad hoc signed Preview DMG
        run: |
          bash scripts/package-macos.sh \
            --binary target/release/pebrel \
            --version "$PACKAGE_VERSION" \
            --preview-id "$PREVIEW_ID" \
            --architecture "${{ matrix.architecture }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-directory dist \
            --force

      - name: Mount final DMG and run conformance
        env:
          NEBULA_RESIZE_TRACE: "1"
        run: |
          dmg="dist/Pebrel-v$ASSET_VERSION-macos-${{ matrix.architecture }}.dmg"
          mount_point="$RUNNER_TEMP/pebrel-preview-${{ matrix.architecture }}"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          cleanup_mount() {
            hdiutil detach "$mount_point" || hdiutil detach "$mount_point" -force
          }
          trap cleanup_mount EXIT

          app="$mount_point/Pebrel Preview.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = \
            "io.github.kuddev.pebrel.preview"
          test "$(lipo -archs "$app/Contents/MacOS/pebrel")" = \
            "${{ matrix.native_architecture }}"
          python3 - "$app" "$dmg" \
            "dist/conformance/macos-${{ matrix.architecture }}-deployment.json" \
            "${{ matrix.native_architecture }}" "$REVIEW_SOURCE" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import platform
          import plistlib
          import struct
          import sys

          app, dmg, report_path = map(Path, sys.argv[1:4])
          architecture, source = sys.argv[4:6]
          cpu_types = {"arm64": 0x0100000c, "x86_64": 0x01000007}
          limit = (12, 0, 0)
          errors = []
          binaries = {}


          def version(value):
              return (value >> 16, (value >> 8) & 255, value & 255)


          def text(parts):
              return ".".join(map(str, parts))


          def macho(path):
              with path.open("rb") as stream:
                  magic = stream.read(4)
                  if magic in (b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca",
                               b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca"):
                      raise ValueError(f"unexpected universal binary in native package: {path.name}")
                  if magic != b"\xcf\xfa\xed\xfe":
                      return None
                  header = stream.read(28)
                  if len(header) != 28:
                      raise ValueError(f"truncated Mach-O header: {path.name}")
                  cpu, _, _, count, size, _, _ = struct.unpack("<7I", header)
                  if size > 4 * 1024 * 1024 or count > size // 8:
                      raise ValueError(f"invalid Mach-O load command bounds: {path.name}")
                  commands = stream.read(size)
              if len(commands) != size:
                  raise ValueError(f"truncated Mach-O commands: {path.name}")
              offset = 0
              versions = []
              for _ in range(count):
                  if len(commands) - offset < 8:
                      raise ValueError(f"missing load command: {path.name}")
                  command, length = struct.unpack_from("<2I", commands, offset)
                  if length < 8 or offset + length > len(commands):
                      raise ValueError(f"invalid load command length: {path.name}")
                  if command == 0x32:
                      if length < 24:
                          raise ValueError(f"invalid LC_BUILD_VERSION: {path.name}")
                      platform_id, minimum, sdk, _ = struct.unpack_from("<4I", commands, offset + 8)
                      if platform_id != 1:
                          raise ValueError(f"binary does not target macOS: {path.name}")
                      versions.append(("LC_BUILD_VERSION", version(minimum), version(sdk)))
                  elif command == 0x24:
                      if length < 16:
                          raise ValueError(f"invalid LC_VERSION_MIN_MACOSX: {path.name}")
                      minimum, sdk = struct.unpack_from("<2I", commands, offset + 8)
                      versions.append(("LC_VERSION_MIN_MACOSX", version(minimum), version(sdk)))
                  offset += length
              if offset != len(commands) or len(versions) != 1:
                  raise ValueError(f"missing or ambiguous deployment version: {path.name}")
              if cpu != cpu_types[architecture]:
                  raise ValueError(f"wrong binary architecture: {path.name}")
              return versions[0]


          plist = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          declared = plist.get("LSMinimumSystemVersion")
          if declared != "12.0":
              errors.append(f"Info.plist advertises {declared}, expected 12.0")
          for path in sorted((app / "Contents").rglob("*")):
              if path.is_symlink() or not path.is_file():
                  continue
              result = macho(path)
              if result is None:
                  continue
              relative = path.relative_to(app).as_posix()
              command, minimum, sdk = result
              binaries[relative] = {"command": command, "minimum": text(minimum), "sdk": text(sdk)}
              if minimum > limit:
                  errors.append(f"{relative} requires macOS {text(minimum)}")
          required = {"Contents/MacOS/pebrel", "Contents/MacOS/pebrel-hook"}
          if missing := sorted(required - binaries.keys()):
              errors.append(f"missing expected binaries: {', '.join(missing)}")
          with dmg.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          report = {
              "source": source,
              "architecture": architecture,
              "runner": {"system": platform.system(), "macos": platform.mac_ver()[0], "machine": platform.machine()},
              "dmg": {"name": dmg.name, "bytes": dmg.stat().st_size, "sha256": digest},
              "plist_minimum": declared,
              "binaries": binaries,
              "errors": errors,
          }
          report_path.parent.mkdir(parents=True, exist_ok=True)
          encoded = json.dumps(report, indent=2) + "\n"
          report_path.write_text(encoded, encoding="utf-8")
          print(encoded, end="")
          if errors:
              raise SystemExit("; ".join(errors))
          PY
          GITHUB_SHA="$REVIEW_SOURCE" python3 scripts/conformance/run.py \
            --app "$app" \
            --platform "macos-${{ matrix.architecture }}" \
            --output "dist/conformance/macos-${{ matrix.architecture }}-report.json"
          GITHUB_SHA="$REVIEW_SOURCE" python3 scripts/conformance/macos_launch.py \
            --app "$app" \
            --output "dist/conformance/macos-${{ matrix.architecture }}-launch.json"

      - name: Upload macOS Preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-package-macos-${{ matrix.architecture }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-macos-${{ matrix.architecture }}
          path: dist/conformance
          if-no-files-found: warn
          retention-days: 14
