name: Cross-platform Preview packages
run-name: "Windows Explorer menu review (PR 456)"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Must be false for this registry acceptance run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  explorer-menu:
    if: ${{ inputs.publish == false }}
    name: Windows installer registry acceptance
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      REVIEW_SOURCE: 261d0871165d3019f92b2ffff65ee1705d2631d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the reviewed production source
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD^') -ne $env:REVIEW_SOURCE) {
            throw 'Unexpected installer source'
          }
          git diff --exit-code $env:REVIEW_SOURCE HEAD -- scripts/installer.iss scripts/installer-context-menu.iss scripts/installer-migration.iss scripts/tests/installer-context-menu-fixture.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'The test driver changed the reviewed installer'
          }

      - name: Compile and run both isolated Inno fixtures
        shell: pwsh
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'review-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $compilerPaths = @(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $compilerPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
            $compiler = $compilerPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          $env:REVIEW_SOURCE | Set-Content (Join-Path $evidence 'source.txt') -Encoding utf8
          $cases = @(
            @{ Name = 'installer-context-menu-fixture'; Reports = @('choices-result.txt', 'wsl-structure-result.txt') },
            @{ Name = 'installer-explorer-review-456'; Reports = @('independent-result.txt') }
          )
          $failed = $false
          foreach ($case in $cases) {
            $dir = Join-Path $env:RUNNER_TEMP ('pebrel-456-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $dir | Out-Null
            $script = Join-Path 'scripts\tests' ($case.Name + '.iss')
            & $compiler '/Q' "/DFixtureRoot=$dir" "/O$dir" $script
            if ($LASTEXITCODE -ne 0) { throw "Inno compilation failed for $script" }
            $exe = Join-Path $dir ($case.Name + '.exe')
            $log = Join-Path $evidence ($case.Name + '.log')
            $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log) -PassThru
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "Inno fixture timed out: $script"
            }
            foreach ($name in $case.Reports) {
              $path = Join-Path $dir $name
              if (-not (Test-Path -LiteralPath $path)) { throw "Missing fixture report: $name" }
              Copy-Item -LiteralPath $path -Destination $evidence
              $report = Get-Content -LiteralPath $path -Raw -Encoding utf8
              Write-Output $report
              $counts = @{ 'choices-result.txt' = 1; 'wsl-structure-result.txt' = 16; 'independent-result.txt' = 6 }
              if (([regex]::Matches($report, '(?m)^(?:PASS|FAIL): ').Count -ne $counts[$name]) -or ($report -match '(?m)^FAIL: ')) {
                $failed = $true
              }
            }
            if ($process.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'At least one Explorer menu registry case failed' }

      - name: Upload registry acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-menu-pr456-evidence
          path: review-evidence
          if-no-files-found: error
          retention-days: 14
