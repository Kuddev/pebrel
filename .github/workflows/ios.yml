name: iOS foundation
on:
  push:
    branches: ['feat/mobile-ios-**']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/host-rust
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check architecture and package contracts
        run: |
          python3 scripts/check_architecture.py --base 4cac5843
          python3 -m unittest discover -s mobile/ios/tools
          python3 -m unittest discover -s mobile/tools -p test_build_ghostty.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Test mobile SSH and Noise
        run: |
          cargo test --manifest-path mobile/ssh/Cargo.toml --locked
          cargo build --manifest-path mobile/ssh/Cargo.toml --locked
          cc -std=c11 -Wall -Werror -Imobile/ssh/include mobile/ssh/tests/c_session.c \
            -L"$CARGO_TARGET_DIR/debug" -Wl,-rpath,"$CARGO_TARGET_DIR/debug" -lpebrel_ssh -o tmp/test-ssh
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          sudo install -d -m755 /run/sshd
          python3 mobile/ios/tools/sshd_fixture.py sh -c \
            'tmp/test-ssh "$PEBREL_TEST_PORT" "$PEBREL_TEST_USER" "$PEBREL_TEST_KEY_PATH" "$PEBREL_TEST_FINGERPRINT"'
      - uses: actions/cache@v4
        id: host-vt
        with:
          path: tmp/ios-vt/host
          key: linux-vt-${{ runner.arch }}-${{ hashFiles('mobile/android/ghostty/UPSTREAM.json', 'mobile/ios/tools/build_vt.py', 'mobile/tools/build_ghostty.py') }}
      - name: Build host VT
        if: steps.host-vt.outputs.cache-hit != 'true'
        run: python3 mobile/ios/tools/build_vt.py --output tmp/ios-vt
      - name: Test terminal bridge
        run: |
          cc -std=c11 -Wall -Werror -Imobile/terminal-bridge/include -Itmp/ios-vt/host/include \
            mobile/terminal-bridge/src/*.c mobile/terminal-bridge/tests/grid.c \
            tmp/ios-vt/host/lib/libghostty-vt.a -lm -lpthread -o tmp/test-grid
          tmp/test-grid

  simulator:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '17.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/ios-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify Apple toolchain
        id: apple
        run: echo "build=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: apple-vt
        with:
          path: |
            tmp/ios-vt/GhosttyVT.xcframework
            tmp/ios-vt/device/include
            tmp/ios-vt/licenses
          key: ios-vt-products-${{ steps.apple.outputs.build }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/android/ghostty/UPSTREAM.json', 'mobile/ios/tools/build_vt.py', 'mobile/tools/build_ghostty.py') }}
      - name: Build device and simulator VT slices
        if: steps.apple-vt.outputs.cache-hit != 'true'
        run: python3 mobile/ios/tools/build_vt.py --output tmp/ios-vt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            tmp/ios-rust
          key: ios-rust-${{ steps.apple.outputs.build }}-${{ runner.arch }}-${{ hashFiles('mobile/ssh/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build device and simulator SSH slices
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo rustc --manifest-path mobile/ssh/Cargo.toml --locked --lib --release --crate-type staticlib --target "$target"
          done
      - name: Generate the iOS application
        run: |
          xcodebuild -create-xcframework \
            -library "$CARGO_TARGET_DIR/aarch64-apple-ios/release/libpebrel_ssh.a" -headers mobile/ssh/include \
            -library "$CARGO_TARGET_DIR/aarch64-apple-ios-sim/release/libpebrel_ssh.a" -headers mobile/ssh/include \
            -output tmp/PebrelSSH.xcframework
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 mobile/ios/tools/assets.py
          export PEBREL_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pebrel_app/Cargo.toml","rb"))["package"]["version"])')
          echo "PEBREL_VERSION=$PEBREL_VERSION" >> "$GITHUB_ENV"
          xcodegen generate --spec mobile/ios/project.yml
      - name: Test PebrelCore
        run: swift test --package-path mobile/ios/PebrelCore
      - name: Test both native libraries and capture the terminal
        run: |
          device=$(python3 mobile/ios/tools/simulator.py)
          xcrun simctl boot "$device" || xcrun simctl bootstatus "$device" -b
          xcodebuild test -project mobile/ios/Pebrel.xcodeproj -scheme Pebrel \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath tmp/DerivedData -resultBundlePath tmp/Simulator.xcresult
          python3 mobile/ios/tools/simulator.py tmp/Simulator.xcresult tmp/screenshots
      - name: Archive and audit the unsigned IPA
        run: |
          xcodebuild archive -project mobile/ios/Pebrel.xcodeproj -scheme Pebrel \
            -destination 'generic/platform=iOS' -archivePath tmp/Pebrel.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p tmp/ipa/Payload
          cp -R tmp/Pebrel.xcarchive/Products/Applications/Pebrel.app tmp/ipa/Payload/
          (cd tmp/ipa && /usr/bin/zip -qry "../Pebrel-$PEBREL_VERSION-ios-unsigned.ipa" Payload)
          python3 mobile/ios/tools/audit_ipa.py "tmp/Pebrel-$PEBREL_VERSION-ios-unsigned.ipa" "$PEBREL_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: tmp/*-ios-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: tmp/screenshots
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tmp/Simulator.xcresult/Info.plist') != ''
        with:
          name: ios-test-results
          path: tmp/Simulator.xcresult
