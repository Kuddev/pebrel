name: PR 140 one-shot repair

on:
  push:
    branches: [codex/render-settings-cache]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: tolerate missing render settings global in workspace tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/render-settings-cache
          fetch-depth: 0
      - name: Apply minimal render fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('nebula_app/src/gpui_shell/workspace.rs')
          text = path.read_text(encoding='utf-8')
          old = """!self.sidebar_collapsed
                                && cx.global::<crate::gpui_shell::config::Settings>().panel_resize,"""
          new = """!self.sidebar_collapsed
                                && cx
                                    .try_global::<crate::gpui_shell::config::Settings>()
                                    .is_some_and(|settings| settings.panel_resize),"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one render settings access, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nebula_app/src/gpui_shell/workspace.rs
          git commit -m 'fix: tolerate missing render settings global in workspace tests'
          git push origin HEAD:codex/render-settings-cache
