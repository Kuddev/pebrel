name: Graphics PTY and window validation
on:
  push:
    branches: [verify/819-graphics-window-20261117]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  CARGO_TERM_COLOR: never
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: transfer
            source: 58b1481dece136102ce3092124b3143b1ebdb7c6
          - case: controls
            source: 5a9abe1fbbe69e2381944e96dc2156ebab2c8926
    env:
      SOURCE: ${{ matrix.source }}
      CASE: ${{ matrix.case }}
      PROOF_DIR: ${{ github.workspace }}/tmp/graphics-window-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve verification driver
        run: cp .github/graphics-window-proof.py "$RUNNER_TEMP/graphics-window-proof.py"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xdotool xvfb xauth imagemagick python3-pil dbus-x11 mesa-vulkan-drivers libvulkan1 weston x11-utils \
            build-essential cmake pkg-config libasound2-dev libdbus-1-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xkb-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: -release-check-v2
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Run the protocol matrix and both image layers on the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$PROOF_DIR"
          profile=(--locked --config .github/ci-profile.toml --profile ci)
          cargo test "${profile[@]}" -p pebrel_terminal --lib -- --test-threads=2 >"$PROOF_DIR/core.log" 2>&1 || { tail -100 "$PROOF_DIR/core.log"; exit 1; }
          cargo test "${profile[@]}" -p pebrel_terminal --test grid_images >"$PROOF_DIR/grid.log" 2>&1 || { tail -80 "$PROOF_DIR/grid.log"; exit 1; }
          cargo test "${profile[@]}" -p pebrel --bin pebrel --features gpui-test-support inline_image::tests -- --test-threads=1 >"$PROOF_DIR/decode.log" 2>&1 || { tail -100 "$PROOF_DIR/decode.log"; exit 1; }
      - name: Build product and verify actual PTY replies, window pixels and deletion
        run: |
          cargo build --locked --config .github/ci-profile.toml --profile ci -p pebrel --bin pebrel --features gpui-shell
          install -d -m 700 "$RUNNER_TEMP/graphics-xdg"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/graphics-xdg" xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- /usr/bin/python3 "$RUNNER_TEMP/graphics-window-proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-window-${{ matrix.case }}
          path: tmp/graphics-window-evidence
          if-no-files-found: warn
          retention-days: 7
