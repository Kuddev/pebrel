name: Verify Windows tab hibernation on the stable candidate
on:
  push:
    branches: [qa/stable-wake-992-1119]
permissions:
  contents: read

jobs:
  hibernate:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: "-release-check-v2"
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Build the stable GPUI product
        shell: pwsh
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula --features gpui-shell --bin pebrel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sleep for five minutes, wake the shell and reopen the workspace
        run: python scripts/conformance/windows_standard_user.py scripts/conformance/windows_hibernation_probe.py target/ci/pebrel.exe
